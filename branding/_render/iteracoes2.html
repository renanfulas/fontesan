<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Iterações 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ddd}
.row{display:flex;gap:20px;padding:20px;flex-wrap:wrap}
.shot{background:#f5eee1;padding:30px}
</style>
</head>
<body>
<div class="row">

<!-- Ícone com respiro -->
<div class="shot" data-name="icone-v2">
<svg width="300" height="300" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1f3826" stroke-width="22"/>
  <g transform="translate(250 266) scale(.92) translate(-256 -256)">
    <path d="M140 292 L224 372 L316 248" fill="none" stroke="#1f3826" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M316 248 C288 178 316 106 398 88 C406 170 376 228 316 248 Z" fill="#1f3826"/>
    <path d="M326 226 L384 116" stroke="#f5eee1" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
</svg>
</div>

<!-- Selo: texto preenchendo o círculo -->
<div class="shot" data-name="selo-v2">
<svg width="360" height="360" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="244" fill="none" stroke="#1f3826" stroke-width="12"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#1f3826" stroke-width="4" opacity=".6"/>
  <path id="arco2" d="M256,44 a212,212 0 1,1 -0.01,0 Z" fill="none"/>
  <text font-family="'IBM Plex Mono',monospace" font-size="36" letter-spacing="13.2" fill="#1f3826">
    <textPath href="#arco2" startOffset="0">· FONTESAN · SEGURANÇA DE ALIMENTOS · ROTINA </textPath>
  </text>
  <g transform="translate(252 274) scale(.58) translate(-256 -256)">
    <path d="M140 292 L224 372 L316 248" fill="none" stroke="#1f3826" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M316 248 C288 178 316 106 398 88 C406 170 376 228 316 248 Z" fill="#1f3826"/>
    <path d="M326 226 L384 116" stroke="#f5eee1" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
</svg>
</div>

</div>
<script>document.fonts.ready.then(()=>{document.title='FONTS-OK'})</script>
</body>
</html>
