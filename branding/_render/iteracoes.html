<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Iterações da marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ddd;font-family:'Public Sans',sans-serif}
.row{display:flex;gap:20px;padding:20px;flex-wrap:wrap}
.shot{background:#f5eee1;padding:30px;display:flex;flex-direction:column;align-items:center;gap:10px}
.shot span{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5d6d54}
svg{display:block}
</style>
</head>
<body>
<div class="row" id="iteracoes">

<!-- A: check-folha, tudo verde -->
<div class="shot" data-name="A-verde">
<svg width="300" height="300" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1f3826" stroke-width="22"/>
  <path d="M148 284 L232 366 L330 232" fill="none" stroke="#1f3826" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 232 C310 176 330 118 396 100 C404 164 380 214 330 232 Z" fill="#1f3826"/>
</svg>
<span>A: tudo verde</span>
</div>

<!-- B: folha laranja -->
<div class="shot" data-name="B-folha-laranja">
<svg width="300" height="300" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1f3826" stroke-width="22"/>
  <path d="M148 284 L232 366 L330 232" fill="none" stroke="#1f3826" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 232 C310 176 330 118 396 100 C404 164 380 214 330 232 Z" fill="#d9821b"/>
</svg>
<span>B: folha laranja</span>
</div>

<!-- C: folha com nervura vazada, tudo verde -->
<div class="shot" data-name="C-nervura">
<svg width="300" height="300" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1f3826" stroke-width="22"/>
  <path d="M148 284 L232 366 L330 232" fill="none" stroke="#1f3826" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 232 C310 176 330 118 396 100 C404 164 380 214 330 232 Z" fill="#1f3826"/>
  <path d="M338 214 L382 126" stroke="#f5eee1" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
<span>C: nervura vazada</span>
</div>

<!-- D: folha maior, check mais curto e centrado -->
<div class="shot" data-name="D-folha-maior">
<svg width="300" height="300" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1f3826" stroke-width="22"/>
  <path d="M140 292 L224 372 L316 248" fill="none" stroke="#1f3826" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M316 248 C288 178 316 106 398 88 C406 170 376 228 316 248 Z" fill="#1f3826"/>
  <path d="M326 226 L384 116" stroke="#f5eee1" stroke-width="11" stroke-linecap="round" fill="none"/>
</svg>
<span>D: folha maior + nervura</span>
</div>

<!-- E: selo completo com texto circular (base D) -->
<div class="shot" data-name="E-selo-completo">
<svg width="300" height="300" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="244" fill="none" stroke="#1f3826" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1f3826" stroke-width="4" opacity=".65"/>
  <path id="arcoE" d="M256,256 m-212,0 a212,212 0 1,1 424,0 a212,212 0 1,1 -424,0" fill="none"/>
  <text font-family="'IBM Plex Mono',monospace" font-size="34" letter-spacing="10" fill="#1f3826">
    <textPath href="#arcoE" startOffset="0">FONTESAN · SEGURANÇA DE ALIMENTOS · ROTINA ·</textPath>
  </text>
  <g transform="translate(256 268) scale(.62) translate(-256 -256)">
    <path d="M140 292 L224 372 L316 248" fill="none" stroke="#1f3826" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M316 248 C288 178 316 106 398 88 C406 170 376 228 316 248 Z" fill="#1f3826"/>
    <path d="M326 226 L384 116" stroke="#f5eee1" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
</svg>
<span>E: selo completo</span>
</div>

<!-- F: lockup horizontal (base D) -->
<div class="shot" data-name="F-horizontal">
<div style="display:flex;align-items:center;gap:22px">
<svg width="92" height="92" viewBox="0 0 512 512">
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1f3826" stroke-width="22"/>
  <path d="M140 292 L224 372 L316 248" fill="none" stroke="#1f3826" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M316 248 C288 178 316 106 398 88 C406 170 376 228 316 248 Z" fill="#1f3826"/>
  <path d="M326 226 L384 116" stroke="#f5eee1" stroke-width="11" stroke-linecap="round" fill="none"/>
</svg>
<div>
  <div style="font-family:'Fraunces',serif;font-weight:600;font-size:56px;color:#1f3826;line-height:1">Fontesan</div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:14.5px;letter-spacing:.32em;color:#9c5a0d;margin-top:8px">SEGURANÇA DE ALIMENTOS</div>
</div>
</div>
<span>F: lockup horizontal</span>
</div>

</div>
<script>document.fonts.ready.then(()=>{document.title='FONTS-OK'})</script>
</body>
</html>
