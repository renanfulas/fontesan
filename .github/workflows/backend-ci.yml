name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Compile and test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        # Version policy: 3.11 is what the VPS production runtime runs;
        # 3.12 is what local development uses. CI must cover both so a
        # 3.12-only feature never breaks production silently.
        python-version:
          - "3.11"
          - "3.12"

    env:
      API_SECRET_KEY: local-dev-api-key
      APP_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python modules
        run: python -m compileall app tests scripts

      - name: Run tests
        run: python -m pytest
